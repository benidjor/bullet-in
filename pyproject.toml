[project]
name = "bullet-in"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "httpx[socks]>=0.27",
  "feedparser>=6.0",
  "playwright>=1.44",
  "twikit>=2.0",
  "pymongo>=4.7",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "google-genai>=1.0",
  "google-auth>=2.30",   # GCS 백업의 서비스 계정 토큰 — genai 의 전이 의존에 기대지 않는다
  "jinja2>=3.1",
  "tenacity>=8.3",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "python-dateutil>=2.9",
  "pyiceberg[sql-sqlite]>=0.11,<0.12",  # 이력 레이크하우스 — 커밋 API 가 마이너 사이에 바뀐다
  "pyarrow>=17",                        # Iceberg 가 Parquet 만 받는다 (Lakehouse 카탈로그 제약)
  "google-cloud-bigquery>=3.25",        # 행동 기록 원본 — storage 패키지 없이 REST 로 중첩까지 받는다
  "dbt-duckdb>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21", "mongomock>=4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bullet_in"]
