  # 서빙 858행을 전량 대조해 「같은 대상인데 표기가 갈린」 군 55종을 찾았고, 그중
  # 정본이 저장소에 이미 선언돼 있는 것만 담는다. 통용 값은 내가 고르지 않고
  # players.ko_full_name (사람) · config/club_map.yaml 키 (구단) 에서 가져왔다
  # — 정본은 그 두 곳이 갖고 이 사전은 집행만 한다.
  #
  # 넣기 전 검사 두 가지를 전 항목에 돌렸다.
  #  ① 오매치 — 오표기가 나온 자리를 앞뒤 문맥과 함께 전수로 읽었다. 그래서
  #     「스포팅 → 스포르팅」 을 뺐다 (4자리가 전부 '스포팅 캔자스 시티' ·
  #     '스포팅 디렉터' 였다 — 넣었으면 멀쩡한 문장 4개가 깨졌다).
  #  ② 게이트 — apply_glossary 가 detect_club_injection 보다 먼저 돌아서 이 사전이
  #     구단 게이트가 보는 문자열까지 바꾼다. 구단 항목은 club_map 에 원문 쪽 표기를
  #     함께 등재해야 fmkorea (한국어 원문) 의 ko 경로 근거가 안 끊긴다.

