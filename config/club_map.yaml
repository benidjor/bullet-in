# 등재 규칙:
# ① 별칭 누락 = 오탐 — 원문이 통칭 (Boro · Spurs) 으로만 표기해도 근거로 인정되게 통칭까지 등재.
# ② 짧은 한글 표기 주의 — 선행 결합 오매치 (시리즈 ⊃ 리즈) 는 코드 가드가 막지만,
#    후행 결합 오매치 (인터뷰 ⊃ 인터 · 로마노 ⊃ 로마 · 포르투갈 ⊃ 포르투) 는 못 막으므로 셋 중 하나로:
#    구별 가능한 긴 표기 등재 (인터 밀란 · AS 로마) / 혼동 상위어의 영문 표기를 별칭에 넣어 접지
#    (포르투 ← Portugal) / 영문 앵커가 없으면 미등재 (릴 — 릴레이 · 릴리스는 일반어).
# ③ 아스날 미등재 — 전 기사가 아스날 문맥이라 검출 신호 없음.
# ④ 같은 구단의 복수 한글 표기 (맨시티 · 맨체스터 시티) 는 각각 등재 (name_map 과 동일).
#    이때 별칭 목록은 완전히 동일하게 — 동일 별칭 목록 = 동의 키 그룹으로 원문 근거를 상호 인정.
