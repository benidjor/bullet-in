freshness_default_hours: 48   # SLO-5 신선도 전역 임계 (h)
tone_backfill_limit: 20       # 말투 백필 회차 상한 (429 여유 내, 라이브 실측 후 조정)

# 이적 키워드 공통 리스트 — 각 소스의 title_contains 에서 *transfer_kw 로 참조
transfer_keywords: &transfer_kw ["transfer", "sign", "signed", "signing", "deal", "loan", "bid", "fee", "medical", "agree", "agreed", "join", "joins", "target", "linked", "links", "contract", "swap", "move", "talks"]

sources:
  - source_id: arsenal_official
    display_name: Arsenal.com
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3) — 구단 공식 발표문은 전문
    tier: 0
    outlet: Arsenal.com
    journalist_label: Arsenal Official
    medium: official
    adapter: arsenal_api
    # 2026-07 리스트 피드 동결 → sitemap 발견 (48h 창) + GetArticle 전환 (spec 2026-07-24).
    # 필터는 어댑터 내 taxonomy 판별 (Transfer news · Contract news + Men)
    config: {}
    freshness_hours: 0     # 신선도 감시 제외 — 이벤트 구동 (1군 발표에만 채택) · 스펙 2026-08-07 §3.2
    enabled: true
  - source_id: bbc_sport
    display_name: BBC Sport
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3 개정 2026-07-20) — 전 소스 전문 서빙
    tier: 1.5   # 비전담 기준선 — 전담 (Mokbel) 은 min 가드로 기자 tier 1 승격
    outlet: BBC
    medium: newspaper
    adapter: html
    config:
      list_url: "https://www.bbc.com/sport/football/teams/arsenal"
      item_selector: "[data-testid='main-content'] a[href*='/sport/football/articles/']"
      title_selector: "span[class*='LinkPostHeadline']"
      title_contains: *transfer_kw
      body_selector: "article"
    # 마감 전 임시값 — 원래 96 · 2026-09-02 마감 뒤 96 으로 원복 (안건 ι · 임계계절성).
    # 원본 수집 기준 재측정에서 최근 14일 알림 1건 · 48h 로 더 내리면 3건.
    freshness_hours: 72    # 공백 95% 75h (21일 실측) — 48h 는 정상 소스를 회차의 22% 에서 stale 로 찍었다
    enabled: true
  - source_id: bbc_gossip
    display_name: BBC Football Gossip
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3 개정 2026-07-20) — 전 소스 전문 서빙
    tier: 4
    # outlet 미지정 — 지정하면 facet 에서 BBC(Tier 1)로 합쳐져 가십 41건이 승격된다
    journalist_label: BBC Gossip
    medium: newspaper
    adapter: html
    body_images: false   # 가십 라운드업 갤러리 (백페이지 스캔) 는 본문 노이즈 — 카드 썸네일만 사용 (2026-07-19 지시)
    config:
      list_url: "https://www.bbc.com/sport/football/gossip"
      item_selector: "a[href*='/sport/football/articles/']"
      body_selector: "article"   # 풀 수집 전환 (트랙 ⑥) — thumbnail_only 는 우선 규칙상 불요라 제거
    freshness_hours: 24    # 공백 95% 21h (21일 실측) — 매일 나오는 라운드업이라 48h 는 넓다
    enabled: true
  - source_id: goal
    display_name: Goal.com
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3 개정 2026-07-20) — 전 소스 전문 서빙
    tier: 4
    outlet: Goal.com
    medium: newspaper
    adapter: html
    # 수집 중단 (2026-08-15) — 공신력 최하이고 주역 귀속 쌍 279 중 202 (72%) 가 같은
    # 선수 · 하루 차이로 다른 소스 기사와 겹친다. enabled 를 끄면 안 된다: load_sources
    # 도 걸러서 언론사 이름 · 공신력 · serving 범위가 사라져 이미 적재된 171건이
    # "goal" 칩 · 미등재 · 본문 발췌로 깨진다 (실측 481장).
    collect: false
    # collect 는 감시 루프에서 안 걸러지므로 (load_sources 가 이 키를 안 본다) 수집이
    # 멈춘 소스가 신선도 판정에 남아 48시간마다 영원히 알린다 — 감시에서 뺀다.
    freshness_hours: 0
    config:
      # 2026-07 팀 슬러그 갱신 · 정적 서빙 확인 → playwright 에서 전환 (spec §4.1)
      list_url: "https://www.goal.com/en/team/arsenal/news/4dsgumo7d4zupm2ugsvm4zm4d"
      item_selector: "a[href^='/en/news/']:not([aria-label]), a[href^='/en/lists/']:not([aria-label])"
      base_url: "https://www.goal.com"
      title_contains: *transfer_kw
      body_selector: "article"
    enabled: true
  - source_id: football_london
    display_name: football.london
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3 개정 2026-07-20) — 전 소스 전문 서빙
    tier: 4
    outlet: football.london
    medium: newspaper
    adapter: html
    journalist_allowlist: ["Tom Canton"]   # 아스날 전담 외 기자 drop (spec §3.1)
    config:
      list_url: "https://www.football.london/arsenal-fc/"
      item_selector: "a.headline"
      title_contains: *transfer_kw
      body_selector: "article"
    enabled: false      # 저품질 기사 비중 · 상위 티어 중복 (스펙 2026-07-29 §4.6)
  - source_id: guardian
    display_name: The Guardian
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3 개정 2026-07-20) — 전 소스 전문 서빙
    tier: 3
    outlet: The Guardian
    medium: newspaper
    # 2026-07-31 API → HTML 전환: 프리 티어가 독점 기사를 배제해 6/20 이후 19건 중 7건
    # (비니시우스 단독 포함) 미반환 실측. HTML 목록이 완전한 상위집합.
    # dcr-* 클래스는 배포마다 바뀌는 난독화 클래스라 의미 속성만 쓴다 — 제목은 aria-label.
    adapter: html
    config:
      list_url: "https://www.theguardian.com/football/arsenal"
      item_selector: "#maincontent a[aria-label]"
      title_attr: "aria-label"
      body_selector: "div[data-gu-name='body']"
      base_url: "https://www.theguardian.com"
      title_contains: *transfer_kw
    # 마감 전 임시값 — 원래 192 · 2026-09-02 마감 뒤 192 로 원복 (안건 ι · 임계계절성).
    # 마감이 다가와 최근 공백 p95 가 45h 로 좁아졌고, 120h 에서 최근 14일 알림 0건.
    freshness_hours: 120   # 공백 95% 168h (21일 실측) — 저빈도 소스 (아스날 태그 주 2~3건)
    enabled: true
  - source_id: skysports
    display_name: Sky Sports
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3 개정 2026-07-20) — 전 소스 전문 서빙
    tier: 2   # 비전담 기준선 — 전담 (Sheth) 은 min 가드로 기자 tier 1.5 승격
    outlet: Sky Sports
    medium: newspaper
    adapter: html
    config:
      # 네비게이션 /football/news/ 혼입 배제 — 타일 헤드라인 스코프 (spec §4.3)
      list_url: "https://www.skysports.com/arsenal"
      item_selector: "h3.sdc-site-tile__headline a[href*='/football/news/']"
      base_url: "https://www.skysports.com"
      title_contains: *transfer_kw
      body_selector: "div.sdc-article-body"
    # 마감 전 임시값 — 원래 120 · 2026-09-02 마감 뒤 120 으로 원복 (안건 ι · 임계계절성).
    # 96h 에서 최근 14일 알림 1건 · 72h 는 2건.
    freshness_hours: 96    # 공백 95% 99h (21일 실측) — 48h 는 정상 소스를 회차의 27% 에서 stale 로 찍었다
    enabled: true
  - source_id: x_afcstuff
    display_name: afcstuff (aggregator)
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3) — 트윗 원문은 수십 단어 = 인용 수준
    medium: x
    adapter: x_playwright
    credibility: x_mentions
    fallback_tier: 4
    freshness_hours: 24   # 공백 95% 15h (21일 실측) — 집계 계정이라 하루 다건
    # own_source_handles — 그 기자의 계정을 우리가 따로 수집하는 핸들 (2026-08-28 사용자 결정).
    # 그런 기자의 **속보** 인용은 원문이 x_ornstein 으로도 들어와 같은 소식이 두 행이 된다
    # (실측: 온스테인 속보 12건 전량이 x_ornstein raw 에도 있었다). 속보만 빼고 논평은 남긴다
    # — 논평은 방송 · 팟캐스트 발언이라 본인이 트윗한 적이 없고 여기서만 들어온다.
    config: { handle: "afcstuff", max_tweets: 30, cookies_path: "x_cookies.json", backtrack_config: "config/backtrack.yaml", own_source_handles: ["David_Ornstein"] }
    # 기자가 아닌 인용처 (2026-08-27 사용자 결정) — @clubgame 은 판타지 축구 게임 앱이라
    # 그 글이 「아스날 26/27 선수 능력치」 처럼 이적 뉴스가 아니다.
    journalist_denylist: ["@clubgame"]
    enabled: true
  - source_id: x_ornstein
    display_name: David Ornstein (X)
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3) — 트윗 원문은 수십 단어 = 인용 수준
    medium: x
    adapter: x_playwright
    tier: 1            # 고정 tier — 본인 트윗엔 @핸들이 없어 x_mentions 판정 불가 (spec 2026-07-25 §5.1)
    # 공백 95% 111h (살아 있던 08-01 이전 구간 실측) — 24h 는 afcstuff (집계 계정) 에나
    # 맞는 값이었고, #AFC 필터가 걸린 본인 계정에는 정상 동작 중에도 112회 중 103회가 stale 이었다.
    freshness_hours: 120
    config: { handle: "David_Ornstein", max_tweets: 30, cookies_path: "x_cookies.json", self_source: true }
    enabled: true
  - source_id: fmkorea
    display_name: fmkorea 축구 소식통
    serving: full      # 상세 페이지 서빙 범위 (spec §2.3) — 퍼가기 금지 정책 (#85) 이 별도 처리
    medium: community
    adapter: fmkorea
    credibility: fmkorea
    lang: ko
    config:
      search_url: "https://www.fmkorea.com/search.php?mid=football_news&search_target={target}&search_keyword={keyword}&page={page}"
      search_keywords:
        # 제목 검색은 제목에 구단명이 없는 아스날 기사를 통째로 놓친다.
        # 2026-09-01 이적시장 마감일 실측에서 여섯 건이 그렇게 사라졌다
        # (알바레스 2건 · 은와네리 · 제주스 · 포파나) — 넷은 본문에 구단명이 있었다.
        # 표기가 둘로 갈려 한쪽만으로는 부족하다
        # (같은 실측에서 [Sky] · [MD] 두 건이 '아스널' 만 썼다).
        # 본문만 스친 글은 뒤의 relevance_terms · 말머리 판정이 거른다.
        - {keyword: "아스날", target: "title_content"}
        - {keyword: "아스널", target: "title_content"}
        - {keyword: '"de roche"', target: "title_content"}
        - {keyword: "온스테인", target: "title_content"}
        # 아스날 감독 인터뷰는 제목에 '아스날' 이 없어 위 키워드에 안 걸린다 (2026-07-30 실측 유실).
        # title_content 검색은 본문만 스친 글도 잡으므로 제목 필수어로 좁힌다.
        - {keyword: "아르테타 이적 시장", target: "title_content", title_must_contain: "아르테타"}
      item_selector: "a.hx"
      base_url: "https://www.fmkorea.com"
      body_selector: ".xe_content"
      max_posts: 15
      # 무관 글 필터 인정 구단 키워드 — 변형 표기 3종 동시 (트러블슈팅 2026-08-01 §4)
      relevance_terms: ["아스날", "아스널", "arsenal"]
    freshness_hours: 24    # 공백 95% 15h (21일 실측) — 커뮤니티라 하루 여러 건
    enabled: true  # 퍼가기 금지 정책·429 대응 구현 완료(2026-06-28)
