version: 2
sources:
  # DuckDB mysql_scanner 가 붙인 MariaDB — 카탈로그는 profiles.yml 의 alias 이고
  # 스키마는 MySQL 데이터베이스 이름이다 (로컬 bulletin · CI bulletin_test).
  - name: maria
    database: maria
    schema: "{{ env_var('DBT_MARIA_DB', 'bulletin') }}"
    tables:
      - name: articles
      - name: players
      - name: article_players
      - name: pipeline_runs
      - name: source_freshness
models:
  - name: stg_articles
    columns:
      - name: content_hash
        tests: [unique, not_null]
      - name: url
        tests: [unique, not_null]
      - name: title_original
        tests: [not_null]
      - name: tier
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 1.5, 2, 3, 4]
  - name: tier_distribution
    columns:
      - name: tier
        tests: [unique, not_null]
  - name: slo_rollup
    columns:
      - name: slo_id
        tests: [unique, not_null]
