version: 2
sources:
  # DuckDB mysql_scanner 가 붙인 MariaDB — 카탈로그는 profiles.yml 의 alias 이고
  # 스키마는 MySQL 데이터베이스 이름이다 (로컬 bulletin · CI bulletin_test).
  - name: maria
    database: maria
    schema: "{{ env_var('DBT_MARIA_DB', 'bulletin') }}"
    tables:
      - name: articles
      - name: players
      - name: article_players
      - name: pipeline_runs
      - name: source_freshness
models:
  - name: stg_articles
    columns:
      - name: content_hash
        tests: [unique, not_null]
      - name: url
        tests: [unique, not_null]
      - name: title_original
        tests: [not_null]
      - name: source_id
        tests: [not_null]
      - name: tier
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 1.5, 2, 3, 4]
      - name: transfer_stage
        tests:
          - accepted_values:
              arguments:
                values: ['interest', 'negotiating', 'personal_terms', 'agreed',
                         'medical', 'done', 'official', 'collapsed', 'rumour', 'other']
              config:
                # 2026-08-31 실측 = 결측 1건 · 분류 패스가 한 회차에 만지는 건수보다
                # 큰 값을 차단 임계로 둔다.
                severity: error
                warn_if: ">0"
                error_if: ">20"
      - name: transfer_direction
        tests:
          - accepted_values:
              arguments:
                values: ['in', 'out', 'none']
              config:
                severity: error
                warn_if: ">0"
                error_if: ">20"
  - name: stg_players
    columns:
      - name: id
        tests: [unique, not_null]
  - name: stg_article_players
    columns:
      - name: player_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_players')
                field: id
      - name: role
        tests:
          - accepted_values:
              arguments:
                values: ['subject', 'mention']
      - name: content_hash
        tests:
          - relationships:
              arguments:
                to: ref('stg_articles')
                field: content_hash
              config:
                # 기사 쪽이 사라진 귀속 — 해시가 갈릴 때 참조가 남는다.
                # 차단 임계 100 의 근거는 알려진 가장 큰 단일 사건이 43건이었다는 것이다
                # (2026-08-29 주소 정정) · 그 두 배가 넘으면 정상 운영에서 나올 수 없다.
                severity: error
                warn_if: ">0"
                error_if: ">100"
  - name: tier_distribution
    columns:
      - name: tier
        tests: [unique, not_null]
  - name: slo_rollup
    columns:
      - name: slo_id
        tests: [unique, not_null]
